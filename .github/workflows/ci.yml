name: Check application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Reject private data in tracked files
        run: |
          if git ls-files | rg -v '(^|/)\.env\.example$' | rg -i '(^|/)(\.data|qa)/|\.(db|sqlite|pdf|docx?|xlsx|zip)(-|$)|(^|/)\.env($|\.)'; then
            echo "Private files must not be committed."
            exit 1
          fi
